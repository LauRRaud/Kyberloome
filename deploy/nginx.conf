server {
    listen 80;
    listen [::]:80;
    server_name xn--kberloome-q9a.ee www.xn--kberloome-q9a.ee;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }
    location / { return 301 https://xn--kberloome-q9a.ee$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.xn--kberloome-q9a.ee;
    ssl_certificate /etc/letsencrypt/live/xn--kberloome-q9a.ee/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--kberloome-q9a.ee/privkey.pem;
    return 301 https://xn--kberloome-q9a.ee$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name xn--kberloome-q9a.ee;
    ssl_certificate /etc/letsencrypt/live/xn--kberloome-q9a.ee/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--kberloome-q9a.ee/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16k;
    location / {
        proxy_pass http://127.0.0.1:3108;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}
