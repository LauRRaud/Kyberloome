services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      SITE_ORIGIN: https://xn--kberloome-q9a.ee
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
volumes:
  caddy_data:
  caddy_config:
